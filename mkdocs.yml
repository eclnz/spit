site_name: SPIT documentation
site_description: The SPIT pipeline language and command line
repo_url: https://github.com/eclnz/spit
repo_name: eclnz/spit
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - search.suggest
markdown_extensions:
  - tables
  - md_in_html
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Guide:
      - File flow: guide/file-flow.md
      - First pipeline: guide/first-pipeline.md
      - Pipeline:
          - Products: guide/products.md
          - Operations: guide/pipelines.md
          - Matching: guide/matching.md
          - Paths: guide/paths.md
          - Types: guide/types-and-reuse.md
          - Reuse: guide/reuse.md
      - Recipe: guide/recipes.md
      - Input inventory: guide/inventory.md
      - Runnable DAG:
          - Handoff: guide/dag.md
          - Inspection: guide/inspection.md
      - Walkthroughs:
          - Sweep: guide/sweep.md
          - Cohort: guide/cohort.md
          - Sensors: guide/sensors.md
          - Stages: guide/stages.md
          - Reusable steps: guide/reusable-steps.md
  - User manual:
      - Syntax index: manual/index.md
      - Foundations: manual/foundations.md
      - Pipeline:
          - Products and stages: manual/pipeline.md
          - Operations: manual/operations.md
          - Matching: manual/matching.md
          - Paths: manual/paths.md
          - Checks: manual/checks.md
          - Types: manual/types.md
          - Imports: manual/reuse.md
      - Recipe: manual/recipe.md
      - Input inventory: manual/inventory.md
      - Runnable DAG: manual/dag.md
      - Command line: manual/cli.md
  - Examples: examples.md
  - Developer documentation:
      - Overview: developer/index.md
      - Compilation: developer/compilation.md
      - Input settlement: developer/inputs.md
      - Resolution: developer/resolution.md
      - Data layout: developer/data-layout.md
      - Diagnostics: developer/diagnostics.md
      - Performance: developer/performance.md
      - Language maintenance: developer/language-maintenance.md
