# The test cluster: a controller on `login`, two compute nodes, accounting through slurmdbd on `db`.
ClusterName=spit-test
SlurmctldHost=login
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
ReturnToService=2
MpiDefault=none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Memory is enforced by the kernel through cgroups, as on most sites.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=5

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=db
JobCompType=jobcomp/none

# Short timers, so a test sees a job leave the queue soon after it ends.
MinJobAge=30
KillWait=10
InactiveLimit=0
MaxArraySize=1001

NodeName=c[1-2] CPUs=2 RealMemory=2048 State=UNKNOWN
PartitionName=compute Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP
