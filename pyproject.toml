# The Python tools that build the docs and check the repository's folders,
# for `uv run`. SPIT itself is Rust; this project is never built or installed.
[project]
name = "spit-tools"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
docs = [
    "properdocs==1.6.7",
    "properdocs-theme-readthedocs==1.6.5",
    "pymdown-extensions==12.1",
]
messie = [
    "messie @ git+https://github.com/eclnz/messie.git@ec77290ac604310d091ce70e9ed3082982df016b",  # v0.2.0
]

[tool.uv]
package = false
default-groups = ["docs", "messie"]
