name: CI

on:
  # A pull request runs on `pull_request` alone, so a branch is checked once;
  # `dev` and `main` are checked as each merge lands.
  push:
    branches: [dev, main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv run --locked --only-group docs properdocs build --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  examples:
    runs-on: ubuntu-latest
    # A release build must not hold up routine PR validation indefinitely.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Functional example checks do not need an optimized release binary.
      - run: cargo build --locked
      - run: python3 examples/checks/check.py --binary target/debug/spit
      - name: Retain example logs and DAGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-checks
          path: target/example-checks
          if-no-files-found: warn

  messie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Check repository folders
        run: uv run --locked --only-group messie messie -af .

  runner:
    # The runner's own tests, on the oldest and newest Python it supports.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./runner
      - run: python -m unittest discover -s runner/tests -v

  runner-examples:
    # The runner runs examples/runnable end to end with the SPIT built from the
    # same commit, so a change to the .spitdag and the runner's change to read it
    # are tested together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ./runner
      - run: python -m unittest discover -s runner/tests -p test_examples.py -v
        env:
          SPIT: ${{ github.workspace }}/target/debug/spit
