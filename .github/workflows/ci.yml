name: CI

on:
  # A pull request runs on `pull_request` alone, so a branch is checked once;
  # `dev` and `main` are checked as each merge lands.
  push:
    branches: [dev, main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: .github/docs-requirements.txt
      - run: uv run --no-project --with-requirements .github/docs-requirements.txt properdocs build --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  examples:
    runs-on: ubuntu-latest
    # A release build must not hold up routine PR validation indefinitely.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Functional example checks do not need an optimized release binary.
      - run: cargo build --locked
      - run: python3 examples/checks/check.py --binary target/debug/spit
      - name: Retain example logs and DAGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-checks
          path: target/example-checks
          if-no-files-found: warn

  messie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: .github/messie-requirements.txt
      - name: Check repository folders
        run: uv run --no-project --with-requirements .github/messie-requirements.txt messie -af .
