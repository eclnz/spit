name: CI

on:
  # A pull request runs on `pull_request` alone, so a branch is checked once;
  # `dev` and `main` are checked as each merge lands.
  push:
    branches: [dev, main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - run: opam install ocamlformat.0.30.0
      - run: opam exec -- ./ocaml/format.sh --check
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv run --locked --only-group format ruff format --check runner/src runner/tests ocaml/tests ocaml/tools release

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv run --locked --only-group docs properdocs build --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./runner
      - run: opam exec -- make test test-bytecode
        env:
          SPIT_BASH: spit-bash

  examples:
    runs-on: ubuntu-latest
    # Existing examples remain acceptance tests for replacement parity (#422).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: opam exec -- make
      - run: python3 examples/checks/check.py --binary _build/spit
      - name: Retain example logs and DAGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-checks
          path: target/example-checks
          if-no-files-found: warn

  messie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Check repository folders
        run: uv run --locked --only-group messie messie -af .

  runner:
    # The runner's own tests, on the oldest and newest Python it supports.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install './runner[test]'
      - run: python -m unittest discover -s runner/tests -v

  runner-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install './runner[types]'
      - run: python -m mypy --config-file runner/pyproject.toml

  runner-slurm-guarantees:
    # The bounded model of Slurm submission, and the fault cases that run the
    # runner's own code against it, which together keep its task and call
    # limits through lost replies and restarts. The 2,001-job scale test and the
    # Docker cluster stay in runner/tests/slurm-checks.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install './runner[test]'
      - run: python runner/tests/slurm_state_model.py
      - run: python -m unittest discover -s runner/tests -p slurm_guarantees.py -v

  runner-examples:
    # The runner runs examples/runnable end to end with the SPIT built from the
    # same commit, so a change to the .spitdag and the runner's change to read it
    # are tested together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - run: opam exec -- make
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ./runner
      - run: python -m unittest discover -s runner/tests -p test_examples.py -v
        env:
          SPIT: ${{ github.workspace }}/_build/spit
