site_name: SPIT documentation
site_description: The SPIT pipeline language and command line
repo_url: https://github.com/eclnz/spit
repo_name: eclnz/spit
docs_dir: docs
theme:
  name: readthedocs
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Language guide:
      - Files and flow: guide/concepts.md
      - Pipelines: guide/pipelines.md
      - Types: guide/types-and-reuse.md
      - Matching: guide/matching.md
      - Paths: guide/paths.md
      - Recipes: guide/recipes.md
      - Plans: guide/inspection.md
      - Runnable DAGs: guide/runnable.md
  - User manual:
      - Language: language-reference.md
      - Command line: cli.md
      - DAG format: spitdag.md
  - Examples: examples.md
  - Architecture:
      - Overview: architecture.md
      - Parsing and lowering: architecture/parsing.md
      - Inputs: architecture/inputs.md
      - Resolution: architecture/resolution.md
      - Binding and output: architecture/binding.md
      - Diagnostics and the editor: architecture/diagnostics.md
      - Extending SPIT: architecture/extending.md
      - Performance: architecture/performance.md
