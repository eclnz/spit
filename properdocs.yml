site_name: SPIT documentation
site_description: The SPIT pipeline language and command line
repo_url: https://github.com/eclnz/spit
repo_name: eclnz/spit
docs_dir: docs
theme:
  name: readthedocs
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
nav:
  - Home: index.md
  - User guide:
      - First run: guide/first-run.md
      - A weather network: guide/walkthrough.md
      - Artifacts: guide/artifacts.md
      - Operations: guide/operations.md
      - Pipelines: guide/pipelines.md
      - Datasets: guide/datasets.md
      - Plans: guide/plans.md
      - Runs: guide/runs.md
      - The weather family: guide/weather.md
      - Troubleshooting: guide/troubleshooting.md
      - The editor: guide/editor.md
      - Glossary and cheat sheet: guide/glossary.md
  - User manual:
      - Language: language-reference.md
      - Command line: cli.md
      - DAG format: spitdag.md
  - Examples: examples.md
  - Architecture:
      - Overview: architecture.md
      - Parsing and lowering: architecture/parsing.md
      - Inputs: architecture/inputs.md
      - Resolution: architecture/resolution.md
      - Binding and output: architecture/binding.md
      - Diagnostics and the editor: architecture/diagnostics.md
      - Extending SPIT: architecture/extending.md
      - Performance: architecture/performance.md
